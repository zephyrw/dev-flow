name: DevFlow public install
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag
        required: true
        type: string
permissions:
  contents: read
jobs:
  public-install:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Pin public package to the checked out release commit
        shell: bash
        run: echo "RELEASE_GIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Anonymous public bootstrap, bundled runtime, page and confirmed stop
        run: node scripts/release/verify-public-install.mjs
