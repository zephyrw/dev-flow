name: DevFlow Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, arch: x64 }
          - { os: macos-15-intel, arch: x64 }
          - { os: macos-15, arch: arm64 }
          - { os: ubuntu-latest, arch: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.7.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          architecture: ${{ matrix.arch }}
          cache: pnpm
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test:unit -- --maxWorkers=1
      - run: pnpm run build
      - run: pnpm run build:host
      - run: go test ./...
        working-directory: host/devflow-host
      - run: node scripts/release/build-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: devflow-${{ runner.os }}-${{ matrix.arch }}
          path: dist/release/*
  draft:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: assets, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: assets/*
