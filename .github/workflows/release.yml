name: DevFlow Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  source-quality:
    uses: ./.github/workflows/quality.yml
    with:
      ref: ${{ github.ref }}
  build:
    needs: source-quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: win32, arch: x64 }
          - { os: macos-15-intel, platform: darwin, arch: x64 }
          - { os: macos-15, platform: darwin, arch: arm64 }
          - { os: ubuntu-latest, platform: linux, arch: x64 }
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_GIT_SHA: ${{ needs.source-quality.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source-quality.outputs.sha }}
          fetch-depth: 0
      - name: Require tag to still identify the quality commit
        shell: bash
        run: test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_GIT_SHA"
      - uses: pnpm/action-setup@v4
        with: { version: 11.7.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          architecture: ${{ matrix.arch }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/release/build-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error
  artifact-validation:
    needs: [source-quality, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: win32, arch: x64 }
          - { os: macos-15-intel, platform: darwin, arch: x64 }
          - { os: macos-15, platform: darwin, arch: arm64 }
          - { os: ubuntu-latest, platform: linux, arch: x64 }
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_GIT_SHA: ${{ needs.source-quality.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source-quality.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          architecture: ${{ matrix.arch }}
      - uses: actions/download-artifact@v4
        with:
          name: candidate-${{ matrix.platform }}-${{ matrix.arch }}
          path: candidate
      - name: Validate identity, contents and native install/upgrade/failure rollback
        run: node scripts/release/validate-candidate.mjs candidate
  draft:
    needs: [source-quality, build, artifact-validation]
    if: ${{ success() && needs.source-quality.result == 'success' && needs.build.result == 'success' && needs.artifact-validation.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-*
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: assets/*
          fail_on_unmatched_files: true
