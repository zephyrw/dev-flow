name: Shared source quality
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
    outputs:
      sha:
        description: Exact source commit checked by every quality job
        value: ${{ jobs.resolve.outputs.sha }}
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  source-quality:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      QUALITY_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: pnpm/action-setup@v4
        with: { version: 11.7.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Independent unit, integration, node:test and app E2E targets with coverage
        run: node scripts/ci/run-targets.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-${{ matrix.os }}-${{ needs.resolve.outputs.sha }}
          path: |
            .cache/quality/run-*/results.json
            .cache/quality/run-*/coverage
