<svg xmlns="http://www.w3.org/2000/svg" width="416" height="1134" viewBox="0 0 416 1134" role="img" aria-labelledby="title description">
  <title id="title">DevFlow 模型接力工作流</title>
  <desc id="description">依次经过规划与审批、开发与检查、验收与提交三段。八步为：调研计划、人工审批、开发实施、自动测试、验收前质量审查、人工验收、验收后代码复核、本地提交。人工审批和人工验收由你确认；其余步骤按规划、执行和复核职责分工。各角色的工具与模型均可自定义。</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#f3f6fb"/></linearGradient>
    <linearGradient id="human" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e4f5ee"/><stop offset="1" stop-color="#edf8f3" stop-opacity="0.4"/></linearGradient>
  </defs>
  <rect width="416" height="1134" rx="20" fill="url(#surface)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif">
<g data-chapter="01"><text x="32" y="35" font-size="12" fill="#73829a" font-weight="650" letter-spacing="1">01</text><text x="59" y="35" font-size="14" fill="#687890" font-weight="400" >先明确要做什么</text><text x="32" y="72" font-size="27" fill="#16243b" font-weight="700" >规划与审批</text><path d="M33 124V195" stroke="#cdd7e6" stroke-width="2"/><g data-step="01" transform="translate(0 0)">

    <circle cx="33" cy="108" r="16" fill="#3159d9"/>
    <text x="33" y="112.5" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">01</text>
    <text x="81" y="115" font-size="23" fill="#16243b" font-weight="650" >调研计划</text>
    <text x="81" y="141" font-size="14" fill="#3159d9" font-weight="600" >规划模型</text>
    <text x="81" y="166" font-size="15" fill="#58677e" font-weight="400" >明确范围、实施步骤与验收标准</text>
  </g><g data-step="02" transform="translate(0 0)">
    <rect x="16" y="188" width="348" height="100" rx="12" fill="url(#human)"/>
    <circle cx="33" cy="211" r="16" fill="#087a58"/>
    <text x="33" y="215.5" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">02</text>
    <text x="81" y="218" font-size="23" fill="#16243b" font-weight="650" >人工审批</text>
    <text x="81" y="244" font-size="14" fill="#087a58" font-weight="600" >由你确认</text>
    <text x="81" y="269" font-size="15" fill="#58677e" font-weight="400" >确认计划，授权开始实施</text>
  </g><path d="M32 302H384" stroke="#d6deea"/></g><g data-chapter="02"><text x="32" y="337" font-size="12" fill="#73829a" font-weight="650" letter-spacing="1">02</text><text x="59" y="337" font-size="14" fill="#687890" font-weight="400" >把计划变成可验收的实现</text><text x="32" y="374" font-size="27" fill="#16243b" font-weight="700" >开发与检查</text><path d="M33 426V600" stroke="#cdd7e6" stroke-width="2"/><g data-step="03" transform="translate(0 0)">

    <circle cx="33" cy="410" r="16" fill="#087e95"/>
    <text x="33" y="414.5" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">03</text>
    <text x="81" y="417" font-size="23" fill="#16243b" font-weight="650" >开发实施</text>
    <text x="81" y="443" font-size="14" fill="#087e95" font-weight="600" >执行模型</text>
    <text x="81" y="468" font-size="15" fill="#58677e" font-weight="400" >按已批准的计划开发</text>
  </g><g data-step="04" transform="translate(0 0)">

    <circle cx="33" cy="513" r="16" fill="#087e95"/>
    <text x="33" y="517.5" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">04</text>
    <text x="81" y="520" font-size="23" fill="#16243b" font-weight="650" >自动测试</text>
    <text x="81" y="546" font-size="14" fill="#087e95" font-weight="600" >执行模型</text>
    <text x="81" y="571" font-size="15" fill="#58677e" font-weight="400" >完成类型检查、构建与测试</text>
  </g><g data-step="05" transform="translate(0 0)">

    <circle cx="33" cy="616" r="16" fill="#7550bd"/>
    <text x="33" y="620.5" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">05</text>
    <text x="81" y="623" font-size="23" fill="#16243b" font-weight="650" >验收前质量审查</text>
    <text x="81" y="649" font-size="14" fill="#7550bd" font-weight="600" >复核模型</text>
    <text x="81" y="674" font-size="15" fill="#58677e" font-weight="400" >检查代码质量与实现遗漏</text>
  </g><path d="M32 707H384" stroke="#d6deea"/></g><g data-chapter="03"><text x="32" y="742" font-size="12" fill="#73829a" font-weight="650" letter-spacing="1">03</text><text x="59" y="742" font-size="14" fill="#687890" font-weight="400" >由你验收，再完成交付</text><text x="32" y="779" font-size="27" fill="#16243b" font-weight="700" >验收与提交</text><path d="M33 831V1005" stroke="#cdd7e6" stroke-width="2"/><g data-step="06" transform="translate(0 0)">
    <rect x="16" y="792" width="348" height="100" rx="12" fill="url(#human)"/>
    <circle cx="33" cy="815" r="16" fill="#087a58"/>
    <text x="33" y="819.5" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">06</text>
    <text x="81" y="822" font-size="23" fill="#16243b" font-weight="650" >人工验收</text>
    <text x="81" y="848" font-size="14" fill="#087a58" font-weight="600" >由你确认</text>
    <text x="81" y="873" font-size="15" fill="#58677e" font-weight="400" >实际操作，确认功能符合预期</text>
  </g><g data-step="07" transform="translate(0 0)">

    <circle cx="33" cy="918" r="16" fill="#7550bd"/>
    <text x="33" y="922.5" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">07</text>
    <text x="81" y="925" font-size="23" fill="#16243b" font-weight="650" >验收后代码复核</text>
    <text x="81" y="951" font-size="14" fill="#7550bd" font-weight="600" >复核模型</text>
    <text x="81" y="976" font-size="15" fill="#58677e" font-weight="400" >复核验收后的最终代码</text>
  </g><g data-step="08" transform="translate(0 0)">

    <circle cx="33" cy="1021" r="16" fill="#3159d9"/>
    <text x="33" y="1025.5" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">08</text>
    <text x="81" y="1028" font-size="23" fill="#16243b" font-weight="650" >本地提交</text>
    <text x="81" y="1054" font-size="14" fill="#3159d9" font-weight="600" >规划模型</text>
    <text x="81" y="1079" font-size="15" fill="#58677e" font-weight="400" >仅提交本任务相关改动</text>
  </g></g><text x="32" y="1110" font-size="16" fill="#3159d9" font-weight="600" >各角色的工具与模型均可自定义</text></g>
</svg>
